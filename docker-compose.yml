services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tahelpdesk
      POSTGRES_USER: tahelpdesk
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahelpdesk -d tahelpdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
