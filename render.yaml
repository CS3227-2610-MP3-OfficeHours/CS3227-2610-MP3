# Render blueprint for the University TA Help Desk.
#
# The service is built from the repository's own Dockerfile, so nothing here is
# specific to Render beyond the resource declarations: the same image runs on
# any container host that injects PORT and a DATABASE_URL.
#
# Secrets are deliberately NOT in this file. Values marked `sync: false` must be
# set in the Render dashboard, and the session secret is generated by Render, so
# no credential is ever committed. See workflow/features/deployment/tasks.md.
services:
  - type: web
    name: ta-help-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render gates the release on this, and the CI workflow re-checks it from
    # outside once the deploy reports done.
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      # The image already pins TA_HELP_DESK_ENV, TA_HELP_DESK_STATIC_DIR and a
      # default port; the entrypoint adopts Render's injected PORT over that.
      - key: TA_HELP_DESK_SESSION_SECRET
        generateValue: true
      # The entrypoint translates this into the application's JDBC URL, user
      # and password, so the database stays a platform resource rather than
      # three hand-copied values.
      - key: DATABASE_URL
        fromDatabase:
          name: ta-help-desk-db
          property: connectionString
      - key: SOCLAAS_BASE_URL
        value: https://soclaas-api.comp.nus.edu.sg/v1
      # Set these in the dashboard. Production uses keys separate from any
      # development key.
      - key: SOCLAAS_STAFF_API_KEY
        sync: false
      - key: SOCLAAS_STUDENT_API_KEY
        sync: false

databases:
  - name: ta-help-desk-db
    plan: free
    # Reachable only by services in this blueprint; never exposed to browsers.
    ipAllowList: []
